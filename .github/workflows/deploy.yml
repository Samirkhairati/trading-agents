# Test -> build and push the image to GHCR -> deploy to the server over SSH.
# Repository secrets needed: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key whose public half is in the server's authorized_keys).
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/requirements.txt
      - run: pip install -r core/requirements.txt
      - run: python -m pytest -q
        working-directory: core

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5   # lower-cases the image name, which GHCR requires
        with:
          images: ghcr.io/${{ github.repository_owner }}/trading-agents
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./core
          platforms: linux/amd64,linux/arm64   # the server is ARM
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n' "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config
      - name: Sync compose files
        run: |
          ssh server 'mkdir -p trading-agents'
          rsync -az docker-compose.yml docker-compose.vm.yml observability server:trading-agents/
      - name: Pull and restart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh server "echo '$GH_TOKEN' | docker login ghcr.io -u '$GH_ACTOR' --password-stdin >/dev/null"
          ssh server 'cd trading-agents && docker compose pull api && docker compose up -d --remove-orphans --wait --wait-timeout 300 && docker image prune -f >/dev/null'
          ssh server 'cd trading-agents && docker compose ps'
