# Everything in containers:  docker compose up -d --build        (API + Prometheus + Grafana)
#                            docker compose run --rm tui          (the terminal UI)
# Keys live in core/.env (never baked into an image). All ports bind to 127.0.0.1.
name: trading-agents

services:
  api:
    build: ./core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./core/.env
        required: false
    environment:
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-0}      # 1 = run the weekday 16:30 ET cycle inside the API
      SCHEDULER_EXECUTE: ${SCHEDULER_EXECUTE:-0}    # 1 = send orders to the PAPER account (default dry run)
    volumes:
      - ./core/data:/app/data                        # decision log, trades, portfolio state survive rebuilds
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  tui:
    build: ./tui
    profiles: ["tui"]
    stdin_open: true
    tty: true
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin-local-pass
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometheus_data:
  grafana_data:
