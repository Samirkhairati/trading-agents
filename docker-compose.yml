# Everything in containers:  docker compose up -d --build        (API + Prometheus + Grafana)
#                            http://localhost:8000                (the web UI, served by the api)
# On a server: ./deploy.sh (adds docker-compose.vm.yml so the api reaches an Ollama container that runs separately).
# Keys live in core/.env (never baked into an image). All ports bind to 127.0.0.1.
name: trading-agents

services:
  api:
    image: ghcr.io/samirkhairati/trading-agents:${TAG:-latest}   # pushed by .github/workflows/deploy.yml; `build` is used when building locally
    build: ./core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./core/.env
        required: false
    environment:                                      # scheduler settings (ENABLE_SCHEDULER, SCHEDULER_EXECUTE, DAILY_AT...) come from core/.env
      STATE_DIR: /app/state
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}   # Ollama runs outside this stack; here: a tunnel to it (see docker-compose.vm.yml for the server)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - state:/app/state                             # analyses, decision log, trades and the simulated account: identical across rebuilds and redeploys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local-pass}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}      # true = anyone can view dashboards (read-only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  state:                                           # `docker compose down` keeps it; `down -v` would delete it
  prometheus_data:
  grafana_data:
